[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tlm"
version = "0.1.0"
description = "Your Tiny Language Model: the NumPy model behind 'Arithmetic Intelligence'"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]
license = {text = "MIT"}

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tlm = "tlm.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains the chat demo (~1 min); skip with -m \"not slow\""]
